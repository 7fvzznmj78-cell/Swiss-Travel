<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="4JsJeDQopuUJGl8Wrs6eZx">

<title>瑞士旅行手册 · 9.25–9.30</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;line-height:1.6;font-size:15px;color:var(--text);background:var(--bg);transition:background .6s ease,color .6s ease;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:root{
  --bg:#f7f3ea;--card:#fffdf7;--text:#1f3025;--muted:#7a8570;
  --accent:#2a5a3a;--accent-soft:#e9ede3;--border:#e0ddd2;
  --shadow:0 1px 3px rgba(60,50,30,.06),0 4px 16px rgba(60,50,30,.07);
  --d0:#2a5a3a;--d1:#3d7a6e;--d2:#5a8d4e;--d3:#7a9bb5;--d4:#8a7a9a;--d5:#c87a2e;
  --tag-book:#c87a2e;--tag-pass:#2a5a3a;--tag-tip:#8a7a3a;
  --tag-book-bg:#f3e7da;--tag-pass-bg:#e9ede3;--tag-tip-bg:#f3efd8;
}
[data-theme=night]{
  --bg:#141b15;--card:#1f2820;--text:#e2e8d8;--muted:#7a8570;
  --accent:#6ab87a;--accent-soft:#1f3326;--border:#2a322a;
  --shadow:0 1px 3px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.15);
  --d0:#6ab87a;--d1:#6bc0b0;--d2:#8ed07a;--d3:#9abfe0;--d4:#b8a8c8;--d5:#ffb05b;
  --tag-book:#ffb05b;--tag-pass:#6ab87a;--tag-tip:#ffd05b;
  --tag-book-bg:#3a2e1e;--tag-pass-bg:#1a2e1e;--tag-tip-bg:#2e2a18;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 60px}
section{margin-top:20px}
h2.sec-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-left:2px;display:flex;align-items:center;gap:6px}
h2.sec-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
.hero{position:relative;border-radius:16px;overflow:hidden;margin-top:16px;box-shadow:0 4px 24px rgba(60,50,30,.22);aspect-ratio:3/4;max-height:420px}
.hero-bg{width:100%;height:100%;object-fit:cover;display:block}
.hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,20,0) 0%,rgba(20,30,20,.02) 30%,rgba(15,25,15,.18) 100%)}
.hero-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:28px;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero-en{font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:5px;opacity:.8;text-transform:uppercase;margin-bottom:2px}
.hero-cn{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:700;letter-spacing:3px;margin-bottom:6px}
.hero-dates{font-size:12px;letter-spacing:3px;opacity:.8;font-weight:500}
.hero-dates span{margin:0 4px;opacity:.5}
#now-card{background:linear-gradient(135deg,#2a5a3a 0%,#3a6a4a 55%,#b87a2e 100%);border-radius:16px;padding:22px 20px 18px;color:#fff;text-align:center;box-shadow:0 4px 24px rgba(60,90,60,.18);margin-top:16px;position:relative;overflow:hidden}
[data-theme=night] #now-card{background:linear-gradient(135deg,#1a2e1e 0%,#0f1814 100%);box-shadow:0 4px 24px rgba(0,0,0,.3)}
#now-card::after{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.now-label{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.now-event{font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.4}
.now-event .ico{font-size:20px;margin-right:4px}
.countdown{display:flex;justify-content:center;align-items:flex-start;gap:6px;margin-bottom:12px}
.cd-unit{text-align:center;min-width:52px}
.cd-num{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px}
.cd-label{font-size:9px;opacity:.5;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.cd-sep{font-size:28px;opacity:.25;font-weight:300;padding-top:4px}
.now-when{font-size:12px;opacity:.65;font-weight:400}
#map-card{background:var(--card);border-radius:16px;padding:16px 12px 10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.map-svg{width:100%;height:auto;display:block}
.map-img{width:100%;height:auto;display:block;border-radius:8px}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;padding:0 6px}
.map-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.map-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.map-leg-bed{font-size:13px}
.conf-card{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px}
.conf-cat{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.conf-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 0;font-size:13px}
.conf-row .lbl{color:var(--muted);white-space:nowrap}
.conf-row .val{font-weight:500;text-align:right}
.conf-status{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.st-ok{background:var(--tag-pass-bg);color:var(--tag-pass)}
.st-pending{background:var(--tag-book-bg);color:var(--tag-book)}
.day-block{margin-bottom:16px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.day-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;position:relative}
.day-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.day-block[data-d="0"] .day-header::before,.day-block[data-d="0"] .day-badge{background:var(--d0)}
.day-block[data-d="1"] .day-header::before,.day-block[data-d="1"] .day-badge{background:var(--d1)}
.day-block[data-d="2"] .day-header::before,.day-block[data-d="2"] .day-badge{background:var(--d2)}
.day-block[data-d="3"] .day-header::before,.day-block[data-d="3"] .day-badge{background:var(--d3)}
.day-block[data-d="4"] .day-header::before,.day-block[data-d="4"] .day-badge{background:var(--d4)}
.day-block[data-d="5"] .day-header::before,.day-block[data-d="5"] .day-badge{background:var(--d5)}
.day-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.day-meta{flex:1;min-width:0}
.day-date{font-size:13px;font-weight:700}
.day-title{font-size:12px;color:var(--muted);margin-top:1px}
.day-expand{font-size:18px;color:var(--muted);transition:transform .3s}
.day-block.open .day-expand{transform:rotate(90deg)}
.day-body{display:none;padding:0 16px 14px}
.day-block.open .day-body{display:block;animation:fadein .3s ease}
.day-route-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;margin-bottom:12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;border:1px solid transparent;transition:border-color .2s}
.day-route-btn:hover{border-color:var(--accent)}
.day-mini-map{margin-bottom:12px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.day-mini-map svg{width:100%;height:auto;display:block}
.day-night{font-size:11px;color:var(--muted);padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
[data-theme=night] .day-night{background:rgba(255,255,255,.03)}
.timeline{position:relative;padding-left:52px}
.timeline::before{content:'';position:absolute;left:44px;top:8px;bottom:8px;width:2px;background:var(--border);border-radius:1px}
.tl-item{position:relative;padding-bottom:14px}
.tl-time{position:absolute;left:-52px;top:0;width:42px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);line-height:1.3}
.tl-time .tz{font-size:8px;opacity:.6}
.tl-dot{position:absolute;left:-12px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--card);z-index:1}
.tl-item[data-pass="1"] .tl-dot{background:var(--tag-pass)}
.tl-item[data-book="1"] .tl-dot{background:var(--tag-book)}
.tl-content{font-size:13px;position:relative}
.tl-title{font-weight:600;margin-bottom:1px;padding-right:18px}
.tl-sub{font-size:11px;color:var(--muted);line-height:1.5}
.tl-loc{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--accent);font-weight:500;margin-top:3px;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.tl-loc:hover{opacity:.7}
.tl-xhs{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--tag-book);font-weight:500;margin-top:4px;margin-left:8px;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;vertical-align:middle}
.tl-xhs:hover{opacity:.7}
.tl-del{position:absolute;right:-2px;top:-2px;width:18px;height:18px;border-radius:50%;background:var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s;line-height:1}
.tl-item:hover .tl-del{opacity:.6}
.tl-del:hover{opacity:1!important;background:var(--tag-book);color:#fff}
.tl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tl-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.5px}
.tl-tag.book{background:var(--tag-book-bg);color:var(--tag-book)}
.tl-tag.pass{background:var(--tag-pass-bg);color:var(--tag-pass)}
.tl-tag.tip{background:var(--tag-tip-bg);color:var(--tag-tip)}
.tl-add-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;border:1px dashed var(--border);color:var(--muted);font-size:12px;font-weight:500;width:100%;cursor:pointer;transition:all .2s}
.tl-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.tl-add-form{display:none;flex-direction:column;gap:6px;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.tl-add-form.show{display:flex}
.tl-add-form input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:12px;outline:none}
.tl-add-form input:focus{border-color:var(--accent)}
.tl-add-form .frm-row{display:flex;gap:6px}
.tl-add-form .frm-row input{flex:1}
.tl-add-form .frm-btns{display:flex;gap:6px;justify-content:flex-end}
.tl-add-form .frm-btns button{padding:4px 14px;border-radius:6px;font-size:12px;font-weight:600}
.tl-add-form .frm-ok{background:var(--accent);color:#fff}
.tl-add-form .frm-cancel{background:var(--border);color:var(--muted)}
#todo-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.todo-add{display:flex;gap:8px;margin-bottom:14px}
.todo-add input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.todo-add input:focus{border-color:var(--accent)}
.todo-add button{padding:0 16px;border-radius:10px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;flex-shrink:0;transition:opacity .2s}
.todo-add button:active{opacity:.7}
.todo-list{list-style:none}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);transition:opacity .3s}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;font-size:14px;color:#fff;line-height:1;margin-top:1px}
.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent)}
.todo-check::after{content:'\2713';opacity:0;font-size:14px}
.todo-item.done .todo-check::after{opacity:1}
.todo-text{flex:1;font-size:13px;line-height:1.5;transition:all .2s}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-del{font-size:16px;color:var(--muted);opacity:.4;cursor:pointer;flex-shrink:0;transition:opacity .2s;padding:0 2px}
.todo-del:hover{opacity:1;color:var(--accent)}
.foot{text-align:center;padding:24px 0 0;font-size:10px;color:var(--muted);opacity:.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.cd-num{animation:pulse 1s ease-in-out infinite}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Side nav */
.side-nav{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:200}
.nav-toggle{width:36px;height:44px;border-radius:0 10px 10px 0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:2px 2px 10px rgba(0,0,0,.15);transition:opacity .2s}
.nav-toggle:hover{opacity:.85}
.nav-panel{position:absolute;left:36px;top:50%;transform:translate(-100%,-50%);transition:transform .3s ease,opacity .3s ease;background:var(--card);border-radius:0 12px 12px 0;box-shadow:var(--shadow);border:1px solid var(--border);border-left:none;padding:6px 0;min-width:128px;opacity:0;pointer-events:none}
.side-nav.open .nav-panel{transform:translate(0,-50%);opacity:1;pointer-events:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;transition:background .2s;white-space:nowrap}
.nav-item:hover{background:var(--accent-soft)}
.nav-emoji{font-size:15px;flex-shrink:0}
.nav-mask{position:fixed;inset:0;z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.nav-mask.show{opacity:1;pointer-events:auto}
</style>

function gmapsLink(k){const l=LOC[k];return l?'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng:'#'}
function gmapsDir(r){const p=r.map(function(k){return LOC[k]}).filter(Boolean);if(p.length<2)return '#';var o=p[0],d=p[p.length-1],w=p.slice(1,-1).map(function(x){return x.lat+','+x.lng}).join('|');var u='https://www.google.com/maps/dir/?api=1&origin='+o.lat+','+o.lng+'&destination='+d.lat+','+d.lng+'&travelmode=transit';if(w)u+='&waypoints='+w;return u}
function xhsLink(k){const l=LOC[k];if(!l)return '#';const cn=l.n.split(' ')[0];return 'https://www.xiaohongshu.com/search/'+encodeURIComponent(cn)}
function fmtTime(ts){var d=new Date(ts);var h=String(d.getHours()).padStart(2,'0');var m=String(d.getMinutes()).padStart(2,'0');var mo=d.getMonth()+1,dy=d.getDate();var wd=['日','一','二','三','四','五','六'][d.getDay()];return mo+'月'+dy+'日 周'+wd+' '+h+':'+m+' CEST'}
function updateCountdown(){var now=Date.now();var next=null;for(var i=0;i<EVENTS.length;i++){if(new Date(EVENTS[i].ts).getTime()>now){next=EVENTS[i];break}}var el=document.getElementById('nowEvent'),elW=document.getElementById('nowWhen');if(!next){el.innerHTML='<span class="ico">🎉</span>旅行已结束，一路平安';elW.innerHTML='';document.getElementById('cdD').textContent='0';document.getElementById('cdH').textContent='0';document.getElementById('cdM').textContent='0';document.getElementById('cdS').textContent='0';return}el.innerHTML='<span class="ico">'+next.ico+'</span>'+next.title;var diff=new Date(next.ts).getTime()-now;document.getElementById('cdD').textContent=Math.floor(diff/86400000);document.getElementById('cdH').textContent=String(Math.floor(diff%86400000/3600000)).padStart(2,'0');document.getElementById('cdM').textContent=String(Math.floor(diff%3600000/60000)).padStart(2,'0');document.getElementById('cdS').textContent=String(Math.floor(diff%60000/1000)).padStart(2,'0');elW.innerHTML=fmtTime(next.ts)+(next.sub?' · '+next.sub:'')}
function drawOverviewMap(){document.getElementById('mapLegend').innerHTML=[{c:'var(--d0)',l:'Day 0 · 日内瓦→采尔马特'},{c:'var(--d1)',l:'Day 1 · 采尔马特→因特拉肯'},{c:'var(--d2)',l:'Day 2 · First山'},{c:'var(--d3)',l:'Day 3 · 卢塞恩·瑞吉'},{c:'var(--d4)',l:'Day 4 · 劳特布仦嫩'},{c:'var(--d5)',l:'Day 5 · 施皮茨·图恩'}].map(function(d){return '<div class="map-leg-item"><div class="map-leg-dot" style="background:'+d.c+'"></div>'+d.l+'</div>'}).join('')+'<div class="map-leg-item"><span class="map-leg-bed">🛏️</span>每晚住宿</div>'}function drawDayMap(day){var pts=day.route.map(function(k){return{key:k,node:NODES[k],loc:LOC[k]}}).filter(function(p){return p.node&&p.loc});if(pts.length<2)return'';var xs=pts.map(function(p){return p.node.x}),ys=pts.map(function(p){return p.node.y});var minX=Math.min.apply(null,xs)-35,maxX=Math.max.apply(null,xs)+35,minY=Math.min.apply(null,ys)-35,maxY=Math.max.apply(null,ys)+35;var svg='<svg viewBox="'+minX+' '+minY+' '+(maxX-minX)+' '+(maxY-minY)+'" preserveAspectRatio="xMidYMid meet">';var c='var(--'+day.color+')';var d='M '+pts[0].node.x+','+pts[0].node.y;for(var i=1;i<pts.length;i++)d+=' L '+pts[i].node.x+','+pts[i].node.y;svg+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" opacity=".75"/>';pts.forEach(function(p,i){svg+='<circle cx="'+p.node.x+'" cy="'+p.node.y+'" r="5" fill="'+c+'" stroke="var(--card)" stroke-width="2"/>';var lbl=p.loc.n.split(' ')[0];var lblY=p.node.y<(minY+maxY)/2?p.node.y-8:p.node.y+14;svg+='<text x="'+p.node.x+'" y="'+lblY+'" text-anchor="middle" font-size="10" fill="var(--text)" font-weight="600">'+lbl+'</text>';if(i===0)svg+='<text x="'+p.node.x+'" y="'+(lblY+12)+'" text-anchor="middle" font-size="8" fill="var(--muted)">起点</text>';if(i===pts.length-1)svg+='<text x="'+p.node.x+'" y="'+(lblY+12)+'" text-anchor="middle" font-size="8" fill="var(--muted)">终点</text>'});if(day.sleep&&day.sleep.loc&&NODES[day.sleep.loc]){var n=NODES[day.sleep.loc];svg+='<text x="'+n.x+'" y="'+(n.y-14)+'" text-anchor="middle" font-size="14">🛏️</text>'}svg+='</svg>';return svg}
function renderConfirmed(){document.getElementById('confirmedBox').innerHTML=CONFIRMED.map(function(c){return'<div class="conf-card"><div class="conf-cat">'+c.cat+'</div>'+c.items.map(function(r){return'<div class="conf-row"><span class="lbl">'+r.l+'</span><span class="val">'+r.v+(r.s==='ok'?'<span class="conf-status st-ok">已确认</span>':'')+(r.s==='pending'?'<span class="conf-status st-pending">待定</span>':'')+'</span></div>'}).join('')+'</div>'}).join('')}
var ITIN=[];var ITIN_KEY='swiss_trip_itin';function loadItin(){try{var s=localStorage.getItem(ITIN_KEY);if(s){ITIN=JSON.parse(s);return}}catch(e){}ITIN=JSON.parse(JSON.stringify(DEFAULT_ITIN))}function saveItin(){try{localStorage.setItem(ITIN_KEY,JSON.stringify(ITIN))}catch(e){}}
function renderItem(it,di,ii){var tags='';if(it.tags){tags='<div class="tl-tags">'+it.tags.map(function(t){return'<span class="tl-tag '+t+'">'+(t==='book'?'需提前订票':t==='pass'?'通票':t==='tip'?'提示':'')+'</span>'}).join('')+'</div>'}else{var p=[];if(it.book)p.push('<span class="tl-tag book">需提前订票</span>');if(it.pass)p.push('<span class="tl-tag pass">通票</span>');if(p.length)tags='<div class="tl-tags">'+p.join('')+'</div>'}var noXhsIco={'✈️':1,'🚆':1,'🏨':1};var xhs=(it.loc&&!noXhsIco[it.ico])?'<a class="tl-xhs" href="'+xhsLink(it.loc)+'" target="_blank">📷 出片攻略</a>':'';return'<div class="tl-item" '+(it.pass?'data-pass="1"':'')+' '+(it.book?'data-book="1"':'')+'><div class="tl-time">'+it.t+(it.tz?'<br><span class="tz">'+it.tz+'</span>':'')+'</div><div class="tl-dot"></div><div class="tl-content"><div class="tl-title">'+(it.ico?it.ico+' ':'')+it.title+'</div>'+(it.sub?'<div class="tl-sub">'+it.sub+'</div>':'')+'<div>'+(it.loc?'<a class="tl-loc" href="'+gmapsLink(it.loc)+'" target="_blank">📍 '+(LOC[it.loc]?LOC[it.loc].n:it.loc)+' ›</a>':'')+xhs+'</div>'+tags+'</div><div class="tl-del" onclick="delItinItem('+di+','+ii+')">×</div></div>'}
function renderItinerary(){document.getElementById('itineraryBox').innerHTML=ITIN.map(function(day,di){var sleepNote=day.sleep&&day.sleep.note?'<div class="day-night">🛏️ 当晚住宿：'+day.sleep.note+'</div>':'';var miniMap=drawDayMap(day);return'<div class="day-block" data-d="'+day.d+'"><div class="day-header" onclick="this.parentElement.classList.toggle(\'open\')"><div class="day-badge">D'+day.d+'</div><div class="day-meta"><div class="day-date">'+day.date+'</div><div class="day-title">'+day.title+'</div></div><div class="day-expand">›</div></div><div class="day-body">'+sleepNote+(miniMap?'<div class="day-mini-map">'+miniMap+'</div>':'')+'<button class="day-route-btn" onclick="window.open(\''+gmapsDir(day.route)+'\',\'_blank\')"><span>🗺️</span>一键打开全天多点导航</button><div class="timeline">'+day.items.map(function(it,ii){return renderItem(it,di,ii)}).join('')+'</div><button class="tl-add-btn" onclick="toggleAddForm('+di+')"><span>＋</span>添加行程</button><div class="tl-add-form" id="addForm-'+di+'"><div class="frm-row"><input type="text" id="addT-'+di+'" placeholder="时间 如 14:00" maxlength="10"><input type="text" id="addIco-'+di+'" placeholder="图标" maxlength="4" value="📍"></div><input type="text" id="addTitle-'+di+'" placeholder="行程标题" maxlength="30"><input type="text" id="addSub-'+di+'" placeholder="备注（可选）" maxlength="50"><div class="frm-btns"><button class="frm-cancel" onclick="toggleAddForm('+di+')">取消</button><button class="frm-ok" onclick="confirmAddItem('+di+')">添加</button></div></div></div></div>'}).join('')}
function toggleAddForm(di){var f=document.getElementById('addForm-'+di);f.classList.toggle('show');if(f.classList.contains('show'))setTimeout(function(){document.getElementById('addTitle-'+di).focus()},50)}
function confirmAddItem(di){var t=document.getElementById('addT-'+di).value.trim();var title=document.getElementById('addTitle-'+di).value.trim();var ico=document.getElementById('addIco-'+di).value.trim()||'📍';var sub=document.getElementById('addSub-'+di).value.trim();if(!title){alert('请输入行程标题');return}ITIN[di].items.push({t:t,tz:t?'CEST':'',ico:ico,title:title,sub:sub,loc:null});saveItin();renderItinerary();document.querySelectorAll('.day-block')[di].classList.add('open')}
function delItinItem(di,ii){ITIN[di].items.splice(ii,1);saveItin();renderItinerary();document.querySelectorAll('.day-block')[di].classList.add('open')}
var todos=[];var TODO_KEY='swiss_trip_todos';function loadTodos(){try{var s=localStorage.getItem(TODO_KEY);if(s){todos=JSON.parse(s);return}}catch(e){}todos=DEFAULT_TODOS.map(function(t){return{text:t.text,done:t.done}})}function saveTodos(){try{localStorage.setItem(TODO_KEY,JSON.stringify(todos))}catch(e){}}function renderTodos(){document.getElementById('todoList').innerHTML=todos.map(function(t,i){return'<li class="todo-item '+(t.done?'done':'')+'"><div class="todo-check" onclick="toggleTodo('+i+')"></div><span class="todo-text">'+t.text+'</span><span class="todo-del" onclick="delTodo('+i+')">×</span></li>'}).join('')}function toggleTodo(i){todos[i].done=!todos[i].done;saveTodos();renderTodos()}function delTodo(i){todos.splice(i,1);saveTodos();renderTodos()}function addTodo(){var inp=document.getElementById('todoInput');var t=inp.value.trim();if(!t)return;todos.push({text:t,done:false});inp.value='';saveTodos();renderTodos()}
function applyTheme(){var h=new Date().getHours();document.documentElement.setAttribute('data-theme',(h<6||h>=19)?'night':'day')}
function toggleSideNav(){var n=document.getElementById('sideNav');var m=document.getElementById('navMask');n.classList.toggle('open');m.classList.toggle('show')}
function navTo(id){var n=document.getElementById('sideNav');var m=document.getElementById('navMask');n.classList.remove('open');m.classList.remove('show');setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},150)}
function init(){applyTheme();loadItin();drawOverviewMap();renderConfirmed();renderItinerary();loadTodos();renderTodos();updateCountdown();setInterval(updateCountdown,1000);setInterval(applyTheme,60000);document.getElementById('todoAddBtn').addEventListener('click',addTodo);document.getElementById('todoInput').addEventListener('keydown',function(e){if(e.key==='Enter')addTodo()})}
init();
</script>
